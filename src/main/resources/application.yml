spring:

  config:
    import: optional:configserver:http://localhost:8888

  application:
    name: itp-identity-service

  datasource:
    url: jdbc:postgresql://localhost:16850/db_iam
    username: itpusr
    password: itp@168
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9090
server:
  port: 9090
eureka:
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2.server.authorization: TRACE
    org.springframework.security.oauth2.server.authorization.oidc.authentication: TRACE
